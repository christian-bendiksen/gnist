[workspace]
members  = [".", "crates/gnist-gio", "crates/herda-ui"]
resolver = "2"

# The vendored herda-ui is a byte-for-byte snapshot of the crate in Herda, so
# the workspace tables it reads have to exist here with the same values. See
# crates/herda-ui/UPSTREAM.md.
[workspace.package]
edition = "2024"
version = "0.4.0"
authors = ["Christian Bendiksen <christian@bendiksen.me>"]
rust-version = "1.95.0"
# Inherited only by the vendored crates/herda-ui, whose manifest is Herda's
# byte for byte and takes its license from the workspace it is built in.
license = "MIT"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
semicolon_in_expressions_from_macros = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
branches_sharing_code = "warn"
cloned_instead_of_copied = "warn"
disallowed_types = "warn"
empty_line_after_outer_attr = "warn"
inefficient_to_string = "allow"
items_after_test_module = "allow"
macro_use_imports = "warn"
map_flatten = "warn"
missing_enforced_import_renames = "warn"
mut_mut = "warn"
nonstandard_macro_braces = "warn"
semicolon_if_nothing_returned = "warn"
str_to_string = "allow"
uninlined_format_args = "warn"
unreadable_literal = "warn"
wildcard_imports = "warn"
literal_string_with_formatting_args = "allow"

[package]
name = "gnist"
version = "0.3.5"
edition = "2024"
description = "Atomic theme switcher for Wayland desktops"
license = "MIT"

[dependencies]
anyhow    = { version = "1", features = ["backtrace"] }
clap      = { version = "4", features = ["derive"] }
tempfile  = "3"
toml      = { version = "0.8", default-features = false, features = ["parse"] }
kdl       = "^6"
walkdir   = "2"
rustix    = { version = "1", features = ["fs"] }
serde_json = "1"
herda-ui  = { path = "crates/herda-ui" }

[profile.release]
strip         = true
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
